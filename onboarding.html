<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started — Easymeasurement</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #fff;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 52px 48px;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    /* Subtle glow behind card */
    .card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Progress dots ── */
    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.3s, transform 0.3s, width 0.3s;
    }

    .dot.active {
      background: #60a5fa;
      transform: scale(1.2);
      width: 24px;
      border-radius: 4px;
    }

    .dot.done {
      background: rgba(96,165,250,0.5);
    }

    /* ── Step illustration area ── */
    .illustration {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin: 0 auto 32px;
    }

    .illustration svg { width: 48px; height: 48px; }

    /* ── Text ── */
    .step-label {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #60a5fa;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .desc {
      text-align: center;
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      line-height: 1.65;
      max-width: 360px;
      margin: 0 auto;
    }

    /* ── Tip box ── */
    .tip {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(96,165,250,0.12);
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 24px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }

    .tip svg { flex-shrink: 0; width: 16px; height: 16px; color: #60a5fa; margin-top: 1px; }

    /* ── Navigation row ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      gap: 12px;
    }

    .btn-back {
      padding: 12px 24px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-back:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-back:disabled { opacity: 0; pointer-events: none; }

    .btn-next {
      flex: 1;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(37,99,235,0.4);
    }

    .btn-next:hover { opacity: 0.92; box-shadow: 0 6px 28px rgba(37,99,235,0.5); }
    .btn-next:active { transform: scale(0.98); }
    .btn-next svg { width: 16px; height: 16px; }

    /* ── Step transition ── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-30px); }
    }

    .step-content { animation: slideIn 0.35s ease both; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 40px 28px; border-radius: 20px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Progress dots -->
  <div class="progress">
    <div class="dot active" id="dot0"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>

  <!-- Step content (swapped by JS) -->
  <div id="stepContent" class="step-content"></div>

  <!-- Navigation -->
  <div class="nav">
    <button class="btn-back" id="btnBack" onclick="prevStep()" disabled>Back</button>
    <button class="btn-next" id="btnNext" onclick="nextStep()">
      <span id="btnNextLabel">Next</span>
      <svg fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

</div>

<script>
  /* ── State helpers ──────────────────────────────────────────── */
  function getState() { return JSON.parse(localStorage.getItem('em_state') || '{}'); }
  function setState(patch) {
    var s = getState();
    localStorage.setItem('em_state', JSON.stringify(Object.assign(s, patch)));
  }

  /* ── Auth guard ─────────────────────────────────────────────── */
  var appState = getState();
  if (!appState.isLoggedIn) { window.location.replace('index.html'); }

  /* ── Step definitions ───────────────────────────────────────── */
  var steps = [
    {
      label: 'Step 1 of 3',
      illustrationBg: 'linear-gradient(135deg, #1e40af, #0ea5e9)',
      illustrationIcon: `
        <svg fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>`,
      title: 'Upload or Capture a Photo',
      desc: 'Start by uploading any image from your device, or snap a photo directly with your camera. Easymeasurement works with any clear photograph.',
      tip: 'For best results, take photos head-on with good, even lighting — avoid angles and shadows.'
    },
    {
      label: 'Step 2 of 3',
      illustrationBg: 'linear-gradient(135deg, #0f766e, #10b981)',
      illustrationIcon: `
        <svg fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <line x1="4" y1="12" x2="20" y2="12"/>
          <polyline points="4 8 4 16"/>
          <polyline points="20 8 20 16"/>
        </svg>`,
      title: 'Calibrate for Real-World Units',
      desc: 'Click <strong style="color:#60a5fa">Calibrate</strong>, then draw a line over an object of known size — like a coin, credit card, or ruler. Enter its real length and you\'re set.',
      tip: 'Calibrate once per photo. The scale transfers automatically to every measurement you draw on that image.'
    },
    {
      label: 'Step 3 of 3',
      illustrationBg: 'linear-gradient(135deg, #7c3aed, #db2777)',
      illustrationIcon: `
        <svg fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M3 7l4 4-4 4M21 11H7"/>
          <line x1="21" y1="7" x2="21" y2="15"/>
        </svg>`,
      title: 'Draw Lines & Measure',
      desc: 'Click <strong style="color:#c084fc">Measure</strong>, then click two points on the photo. The real-world distance appears instantly. Switch units anytime — cm, mm, inches, and more.',
      tip: 'You can draw multiple measurement lines on a single image. Click Clear to start fresh.'
    }
  ];

  var currentStep = 0;

  /* ── Render a step ──────────────────────────────────────────── */
  function renderStep(index) {
    var step   = steps[index];
    var isLast = (index === steps.length - 1);

    // Progress dots
    steps.forEach(function(_, i) {
      var dot = document.getElementById('dot' + i);
      dot.className = 'dot' + (i === index ? ' active' : (i < index ? ' done' : ''));
    });

    // Content
    var content = document.getElementById('stepContent');
    content.style.animation = 'none';
    content.offsetHeight; // reflow
    content.style.animation = '';
    content.innerHTML =
      '<div class="illustration" style="background:' + step.illustrationBg + '">' +
        step.illustrationIcon +
      '</div>' +
      '<p class="step-label">' + step.label + '</p>' +
      '<h1>' + step.title + '</h1>' +
      '<p class="desc">' + step.desc + '</p>' +
      '<div class="tip">' +
        '<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">' +
          '<circle cx="12" cy="12" r="10"/>' +
          '<line x1="12" y1="8" x2="12" y2="12"/>' +
          '<line x1="12" y1="16" x2="12.01" y2="16"/>' +
        '</svg>' +
        step.tip +
      '</div>';

    // Back button
    document.getElementById('btnBack').disabled = (index === 0);

    // Next / Get Started label
    document.getElementById('btnNextLabel').textContent = isLast ? 'Get Started' : 'Next';
  }

  /* ── Navigation ─────────────────────────────────────────────── */
  function nextStep() {
    if (currentStep < steps.length - 1) {
      currentStep++;
      renderStep(currentStep);
    } else {
      // Onboarding complete — go to dashboard
      setState({ hasCompletedOnboarding: true });
      window.location.href = 'dashboard.html';
    }
  }

  function prevStep() {
    if (currentStep > 0) {
      currentStep--;
      renderStep(currentStep);
    }
  }

  // Initial render
  renderStep(0);
</script>

</body>
</html>
