<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Easymeasurement</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e8f4fd 0%, #f0f9f4 100%);
      color: #1a1a2e;
    }

    .board {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.10);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; fill: #fff; }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* --- Social buttons --- */
    .social-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }

    .btn-social:hover {
      background: #f9fafb;
      border-color: #d1d5db;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .btn-social svg, .btn-social img { width: 20px; height: 20px; flex-shrink: 0; }

    /* --- Divider --- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #9ca3af;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* --- Form --- */
    .form { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label { font-size: 13px; font-weight: 600; color: #374151; }

    .field input {
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fafafa;
    }

    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      background: #fff;
    }

    .field input::placeholder { color: #b0b7c3; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-primary {
      margin-top: 4px;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.98); }

    .terms {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      margin-top: 4px;
      line-height: 1.5;
    }

    .terms a { color: #2563eb; text-decoration: none; }
    .terms a:hover { text-decoration: underline; }

    .signin-link {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
    }

    .signin-link a { color: #2563eb; font-weight: 600; text-decoration: none; }
    .signin-link a:hover { text-decoration: underline; }

    /* --- Success state --- */
    .success-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      padding: 16px 0;
    }

    .success-msg .check {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .success-msg .check svg { width: 32px; height: 32px; stroke: #fff; fill: none; }
    .success-msg h2 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .success-msg p { color: #6b7280; font-size: 14px; }

    /* Responsive */
    @media (max-width: 480px) {
      .board { padding: 36px 24px; border-radius: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="board">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="logo-text">Easymeasurement</span>
  </div>

  <h1>Create your account</h1>
  <p class="subtitle">Start measuring smarter in seconds</p>

  <!-- Social sign-up options -->
  <div class="social-options">
    <button class="btn-social" onclick="handleSocial('Google')">
      <!-- Google icon -->
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <button class="btn-social" onclick="handleSocial('GitHub')">
      <!-- GitHub icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#24292e">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      Continue with GitHub
    </button>

    <button class="btn-social" onclick="handleSocial('Microsoft')">
      <!-- Microsoft icon -->
      <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Continue with Microsoft
    </button>
  </div>

  <div class="divider">or sign up with email</div>

  <!-- Email form -->
  <form class="form" id="signupForm" onsubmit="handleSubmit(event)">
    <div class="row">
      <div class="field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" placeholder="Jane" required />
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" placeholder="Doe" required />
      </div>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="jane@example.com" required />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required />
    </div>

    <button type="submit" class="btn-primary">Create free account</button>

    <p class="terms">
      By signing up, you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>
  </form>

  <!-- Success state (hidden until form submitted) -->
  <div class="success-msg" id="successMsg">
    <div class="check">
      <svg viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>You're all set!</h2>
    <p>Check your inbox for a confirmation email<br>and start measuring smarter.</p>
  </div>

  <p class="signin-link">Already have an account? <a href="#">Sign in</a></p>
</div>

<script>
  function handleSocial(provider) {
    alert("Redirecting to " + provider + " sign-up…\n(Connect your OAuth provider here)");
  }

  function handleSubmit(e) {
    e.preventDefault();
    const form = document.getElementById("signupForm");
    const success = document.getElementById("successMsg");
    form.style.display = "none";
    success.style.display = "flex";
  }
</script>

</body>
</html>
